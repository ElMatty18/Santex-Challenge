spring.application.name=workflow-inbox

# Database: H2 in memory, kept alive for the lifetime of the JVM
spring.datasource.url=jdbc:h2:mem:workflowinbox;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Schema is owned by Flyway (classpath:db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# H2 console (development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
